name: Publication deadline monitor
on:
  schedule:
    # 07:17 Eastern in summer/winter; evaluator suppresses pre-deadline checks.
    - cron: '17 11,12,13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnostic = read-only check, never touches issues. exercise-issue = create/dedup/close a clearly titled DIAGNOSTIC issue (never a production incident).'
        type: choice
        options:
          - diagnostic
          - exercise-issue
        default: diagnostic
permissions:
  contents: read
  issues: write
concurrency:
  group: frontpage-publication-monitor
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publication independently
        env:
          GH_TOKEN: ${{ github.token }}
          DFE_PUBLICATION_DEADLINE: ${{ vars.DFE_PUBLICATION_DEADLINE || '07:00' }}
          DFE_MONITOR_EVIDENCE_PATH: ${{ runner.temp }}/publication-monitor-evidence.json
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'production' }}
        run: |
          case "$MODE" in
            production) node scripts/publication-monitor.mjs ;;
            exercise-issue) node scripts/publication-monitor.mjs --exercise-issue ;;
            *) node scripts/publication-monitor.mjs --diagnostic ;;
          esac
      - name: Retain monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-monitor-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/publication-monitor-evidence.json
          if-no-files-found: warn
          retention-days: 90
